[package]
name = "hotswitch-sender"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
hotswitch-proto = { path = "../proto" }
tray-icon = "0.21"
tao = "0.34"
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-tar", "compression-flate2"] }
cpal = "0.15"
crossbeam-queue = "0.3.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
coreaudio-rs = { version = "0.11", default-features = false, features = ["audio_unit", "core_audio"] }
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSFont", "NSGraphics", "NSGridView", "NSLayoutAnchor", "NSLayoutConstraint", "NSMenu", "NSMenuItem", "NSPopUpButton", "NSResponder", "NSRunningApplication", "NSText", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDistributedNotificationCenter", "NSGeometry", "NSNotification", "NSObject", "NSProcessInfo", "NSString"] }
